[package]
name = "staticly"
version = "0.1.1"
description = "Compile-time lookup generator"
edition = "2024"
documentation = "https://docs.rs/staticly"
repository = "https://github.com/bobbothe2nd/staticly"
readme = "README.md"
license = "MIT"
keywords = ["hash", "hashmap", "map", "static" ]
categories = [ "data-structures" ]

[dependencies]
staticly-hash = { path = "../staticly-hash", version = "0.1.0" }
staticly-macros = { path = "../staticly-macros", version = "0.1.0" }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "hashmap"
harness = false
